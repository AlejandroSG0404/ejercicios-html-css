<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Biblioteca</title>
    <style>
        .estado {
            font-weight: bold;
        }

        .estado-pendiente {
            color: #8a5700;
            background-color: #fff1c2;
        }

        .estado-aprobada {
            color: #176b36;
            background-color: #d9f2e1;
        }

        .estado-rechazada {
            color: #9b1c1c;
            background-color: #fde0e0;
        }

        table {
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
    <h1>Reserva de libros</h1>

    <form id="formulario-reserva" novalidate>
        <fieldset>
            <legend>Datos del usuario</legend>
            <label for="nombre">Nombre del usuario:</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name"><br>
            <label for="socio">Número de socio:</label>
            <input type="text" id="socio" name="socio"><br>
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" autocomplete="email">
        </fieldset>

        <fieldset>
            <legend>Datos de la reserva</legend>
            <label for="titulo">Título del libro:</label>
            <input type="text" id="titulo" name="titulo">
            <br>
            <label for="autor">Autor:</label>
            <input type="text" id="autor" name="autor">
            <br>
            <label for="fecha-reserva">Fecha de reserva:</label>
            <input type="date" id="fecha-reserva" name="fecha-reserva">
            <br>
            <label for="fecha-recogida">Fecha prevista de recogida:</label>
            <input type="date" id="fecha-recogida" name="fecha-recogida">
            <p>Tipo de préstamo:</p>
            <label><input type="radio" name="tipo-prestamo" value="Sala"> Sala</label>
            <label><input type="radio" name="tipo-prestamo" value="Domicilio"> Domicilio</label>
        </fieldset>

        <fieldset>
            <legend>Comentarios</legend>
            <label for="comentarios">Comentarios adicionales:</label>
            <br>
            <textarea id="comentarios" name="comentarios"></textarea>
        </fieldset>

        <button type="submit">Enviar reserva</button>
        <button type="reset">Limpiar campos</button>
    </form>

    <h2>Reservas registradas</h2>
    <table>
        <thead>
            <tr>
                <th scope="col">Usuario</th>
                <th scope="col">N.º de socio</th>
                <th scope="col">Correo electrónico</th>
                <th scope="col">Libro</th>
                <th scope="col">Autor</th>
                <th scope="col">Fecha de reserva</th>
                <th scope="col">Recogida prevista</th>
                <th scope="col">Préstamo</th>
                <th scope="col">Comentarios</th>
                <th scope="col">Estado</th>
            </tr>
        </thead>
    </table>

</body>
</html>
