<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripcion</title>
</head>

<body>
    <h1> Inscripción Curso de Informatica</h1>

    <form action="UsuarioRegistrado.html" method="post">
        <label for="fname">Nombre y Apellidos:</label><br>
        <input type="text" id="fname" name="fname"><br>
        <label for="lname">DNI:</label><br>
        <input type="text" id="lname" name="lname"><br>
        <label for="bday">Fecha de Nacimiento:</label><br>
        <input type="date" id="bday" name="bday"><br>
        <label for="email">Correo Electrónico:</label><br>
        <input type="email" id="email" name="email"><br>
        <label for="phone">Teléfono:</label><br>
        <input type="tel" id="phone" name="phone"><br>
        <label for="ciclo">Ciclo formativo en el que está matriculado:</label><br>
        <input type="text" id="ciclo" name="ciclo"><br>
        <label for="radio">Turno preferido: mañana o tarde.</label><br>
        <input type="radio" id="Mañana" name="turno" value="Mañana">
        <input type="radio" id="Tarde" name="turno" value="Tarde"><br>
        <label for="radio">Modalidad: presencial, semipresencial u online.</label><br>
        <input type="radio" id="Presencial" name="modalidad" value="Presencial">
        <input type="radio" id="Semipresencial" name="modalidad" value="Semipresencial">
        <input type="radio" id="Online" name="modalidad" value="Online"><br>
        <label for="checkbox">Acepto los términos y condiciones:</label><br>
        <input type="checkbox" id="checkbox" name="checkbox"><br>
        <input type="submit" value="Submit">
    </form>

</body>

</html>
